name: Growth Radar sync RUN 461 config
on:
  push:
    paths:
      - '.github/workflows/growth_radar_sync_run461.yml'
permissions:
  contents: write
concurrency:
  group: growth-radar-sync-run461
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize CURRENT_WORKING_CONFIG top summary
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          p=Path('CURRENT_WORKING_CONFIG.md')
          s=p.read_text(encoding='utf-8')
          now=datetime.now(timezone(timedelta(hours=3))).isoformat(timespec='seconds')
          lines=s.splitlines()
          for i,line in enumerate(lines):
              if line.startswith('**Версия:**'):
                  lines[i]=f'**Версия:** {now}  '
                  break
          s='\n'.join(lines) + ('\n' if s.endswith('\n') else '')
          replacements=[
            ('**Последний полностью завершённый RUN:** `N5K-20260827-460`','**Последний полностью завершённый RUN:** `N5K-20260827-461`'),
            ('**Физически подтверждённый canonical/contactable:** **477 / 477**','**Физически подтверждённый canonical/contactable:** **478 / 478**'),
            ('**Осталось до 1000:** **523**','**Осталось до 1000:** **522**'),
            ('**Осталось до 5000:** **4523**','**Осталось до 5000:** **4522**'),
            ('- physical canonical/contactable count: **477 / 477**;','- physical canonical/contactable count: **478 / 478**;'),
            ('- последний завершённый RUN: `N5K-20260827-460`;','- последний завершённый RUN: `N5K-20260827-461`;')
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected config marker not found: {old}')
              s=s.replace(old,new,1)
          marker='- `N5K-20260827-460`: 477/477, +1, PASS, orphan 0/0.'
          newrow='- `N5K-20260827-461`: 478/478, +1, PASS, orphan 0/0.'
          if newrow not in s:
              if marker not in s:
                  raise SystemExit('RUN460 list marker not found')
              s=s.replace(marker, marker+'\n'+newrow, 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit synchronized config
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CURRENT_WORKING_CONFIG.md
          git diff --cached --quiet && exit 0
          git commit -m 'growth-radar: sync config summary through RUN 461'
          git push
