name: Sync GRM-117 into canonical data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-grm117.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append confirmed GRM-117 safely
        shell: python
        run: |
          from pathlib import Path
          import csv

          master = Path('data/leads_master.csv')
          inc = Path('data/increments/leads_2026-07-31_093.csv')
          if not master.exists() or not inc.exists():
              raise SystemExit('Required files are missing')

          with master.open('r', encoding='utf-8-sig', newline='') as f:
              master_rows = list(csv.DictReader(f))
              fieldnames = list(master_rows[0].keys()) if master_rows else []
          with inc.open('r', encoding='utf-8-sig', newline='') as f:
              inc_rows = list(csv.DictReader(f))
          if len(inc_rows) != 1 or inc_rows[0].get('Lead ID') != 'GRM-117':
              raise SystemExit('Increment is not the expected single GRM-117 row')
          if not fieldnames or set(inc_rows[0].keys()) != set(fieldnames):
              raise SystemExit('CSV schemas do not match')

          ids = {r.get('Lead ID') for r in master_rows}
          inns = {r.get('INN') for r in master_rows if r.get('INN')}
          row = inc_rows[0]
          if row['Lead ID'] not in ids:
              if row.get('INN') in inns:
                  raise SystemExit('Duplicate INN detected')
              master_rows.append(row)
              with master.open('w', encoding='utf-8', newline='') as f:
                  w = csv.DictWriter(f, fieldnames=fieldnames, lineterminator='\n')
                  w.writeheader(); w.writerows(master_rows)

          if sum(1 for r in master_rows if r.get('Lead ID') == 'GRM-117') != 1:
              raise SystemExit('GRM-117 integrity check failed')
          if len(master_rows) != 117:
              raise SystemExit(f'Expected 117 master rows, got {len(master_rows)}')
      - name: Commit canonical sync
        run: |
          if git diff --quiet -- data/leads_master.csv; then
            echo 'Master already synchronized'
            exit 0
          fi
          git config user.name 'growth-radar-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/leads_master.csv
          git commit -m 'fix: integrate confirmed GRM-117 into leads master'
          git push
