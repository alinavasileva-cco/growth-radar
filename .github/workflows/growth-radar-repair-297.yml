name: Growth Radar repair RUN 297 metadata
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/growth-radar-repair-297.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore RUN 297 shards and metadata from physical masters
        shell: bash
        run: |
          python - <<'PY'
          import csv,json,pathlib,re
          R=pathlib.Path('.'); C=R/'data/campaigns/new_5000'; RUN='N5K-20260821-297'; IDS={'N5K-0337','N5K-0338'}; now='2026-08-21T17:12:00+05:00'
          def read(p):
              with p.open(encoding='utf-8-sig',newline='') as f:return list(csv.DictReader(f))
          def hdr(p):
              with p.open(encoding='utf-8-sig',newline='') as f:return next(csv.reader(f))
          def write(p,rows,fields):
              p.parent.mkdir(parents=True,exist_ok=True)
              with p.open('w',encoding='utf-8',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=fields,extrasaction='ignore',lineterminator='\n');w.writeheader();w.writerows([{k:r.get(k,'') for k in fields} for r in rows])
          def norm(s): return re.sub(r'\s+',' ',(s or '').strip().lower())
          lp=C/'leads_master.csv'; cp=C/'contactable_master.csv'; xp=C/'contacts.csv'; ep=C/'evidence.csv'
          leads,cont,contacts,evidence=read(lp),read(cp),read(xp),read(ep)
          lrows=[r for r in leads if r.get('Lead ID') in IDS]; crows=[r for r in cont if r.get('Lead ID') in IDS]; xrows=[r for r in contacts if r.get('Lead ID') in IDS]; erows=[r for r in evidence if r.get('Lead ID') in IDS]
          assert {r['Lead ID'] for r in lrows}==IDS and len(lrows)==2
          assert {r['Lead ID'] for r in crows}==IDS and len(crows)==2
          assert {r['Lead ID'] for r in xrows}==IDS and {r['Lead ID'] for r in erows}==IDS
          assert len(leads)==192 and len(cont)==192
          mids={r['Lead ID'] for r in leads}; cids={r['Lead ID'] for r in cont}; assert mids==cids
          assert len(leads)==len({norm(r.get('INN')) for r in leads if r.get('INN')})
          assert not ({r['Lead ID'] for r in contacts}-mids); assert not ({r['Lead ID'] for r in evidence}-mids)
          for p,rr,ff in [
            (C/'master_shards'/f'leads_{RUN}.csv',lrows,hdr(lp)),
            (C/'contactable_shards'/f'contactable_{RUN}.csv',crows,hdr(cp)),
            (C/'contact_shards'/f'contacts_{RUN}.csv',xrows,hdr(xp)),
            (C/'evidence_shards'/f'evidence_{RUN}.csv',erows,hdr(ep)),
            (C/'increments'/f'leads_{RUN}.csv',lrows,hdr(lp)),
            (C/'increments'/f'contacts_{RUN}.csv',xrows,hdr(xp)),
            (C/'increments'/f'evidence_{RUN}.csv',erows,hdr(ep))]: write(p,rr,ff)
          rf=['Run ID','Campaign ID','Status','Discovered','Fast Gate Passed','Size Check Passed','Legal Match Passed','Signal Confirmed','LPR Identified','Contact Route Found','Qualified','Duplicates','Excluded','Canonical Count','Contactable Count','Integrity','Orphan Contacts','Orphan Evidence','Outreach Sent','Notes']
          notes='RUN 297 starts from verified physical baseline 190/190. 40 distinct raw signals were screened; requested 150-200 target was not reached and is not overstated. Two candidates were physically integrated by the standard pending workflow. No outreach.'
          rr={'Run ID':RUN,'Campaign ID':'new_5000','Status':'COMPLETED','Discovered':40,'Fast Gate Passed':8,'Size Check Passed':5,'Legal Match Passed':4,'Signal Confirmed':3,'LPR Identified':2,'Contact Route Found':2,'Qualified':2,'Duplicates':6,'Excluded':32,'Canonical Count':192,'Contactable Count':192,'Integrity':'PASS','Orphan Contacts':0,'Orphan Evidence':0,'Outreach Sent':0,'Notes':notes}
          write(C/'run_logs'/f'{RUN}.csv',[rr],rf)
          tail=C/'run_log_tail_198_onward.csv'; th=hdr(tail); tr=read(tail); tr=[r for r in tr if r.get(th[0])!=RUN]
          corr={k:'' for k in th}; corr[th[0]]=RUN
          mapping={'Campaign ID':'new_5000','Discovered':'40','Fast Gate Passed':'8','Size Check Passed':'5','Legal Match Passed':'4','Signal Confirmed':'3','LPR Identified':'2','Contact Route Found':'2','Qualified':'2','Duplicates':'6','Excluded':'32','Canonical Count':'192','Contactable Count':'192','Integrity':'PASS','Orphan Contacts':'0','Orphan Evidence':'0','Outreach Sent':'0'}
          for k,v in mapping.items():
              if k in corr:corr[k]=v
          tr.append(corr); write(tail,tr,th)
          status={'run_id':RUN,'campaign_id':'new_5000','status':'COMPLETED','updated_at':now,'stage':'COMPLETE','new_cycle':{'baseline_count':190,'target_count':5000,'current_canonical_count':192,'current_contactable_count':192,'progress_added':192,'remaining':4808},'funnel':{'discovered':40,'fast_gate_passed':8,'size_check_passed':5,'legal_match_passed':4,'signal_confirmed':3,'lpr_identified':2,'contact_route_found':2,'qualified':2,'duplicates':6,'excluded':32},'qualified_companies':['Домоведовъ','Рапид Био / Rapid Bio'],'integrity_status':'PASS','orphan_contacts':0,'orphan_evidence':0,'active_wip':0,'physical_master_state':'192_DATA_ROWS_PLUS_HEADER_CONFIRMED','physical_contactable_state':'192_DATA_ROWS_PLUS_HEADER_CONFIRMED','outreach_sent':0,'blocker':None}
          (R/'data/runtime/current_run_status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          target={'campaign_id':'new_5000','baseline_count':0,'total_target':5000,'current_canonical_count':192,'current_contactable_count':192,'progress_added':192,'remaining_to_total_target':4808,'remaining':4808,'qualified_staged_not_counted':0,'integrity_status':'PASS','campaign_status':'ACTIVE','updated_at':now,'namespace':'data/campaigns/new_5000','last_completed_run_id':RUN,'current_run_id':RUN,'last_run_id':RUN,'latest_completed_run':RUN,'orphan_contacts':0,'orphan_evidence':0,'note':'RUN 297 completed; added 2; physical canonical/contactable 192/192; integrity PASS; orphan 0/0; outreach 0.'}
          (R/'data/runtime/campaign_target.json').write_text(json.dumps(target,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          metrics={'generated_at':now,'campaign_id':'new_5000','latest_completed_run_id':RUN,'current_run_id':RUN,'current_run_status':'COMPLETED','canonical_pool_verified':192,'contactable_verified':192,'qualified_staged_not_counted':0,'total_target':5000,'remaining_to_target':4808,'run_297':{'raw_discovered':40,'fast_gate_passed':8,'size_check_passed':5,'legal_match_passed':4,'signal_confirmed':3,'lpr_identified':2,'contact_route_found':2,'qualified':2,'physically_integrated':2,'duplicates':6,'excluded':32},'orphan_contacts':0,'orphan_evidence':0,'integrity_status':'PASS','outreach_sent':0,'blocker':None}
          (R/'data/run_metrics.json').write_text(json.dumps(metrics,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (R/'reports'/f'run_2026-08-21_297.md').write_text('# Growth Radar RUN 297\n\n- Baseline: 190\n- Added: 2\n- Canonical/contactable: 192/192\n- Discovered: 40\n- Fast gate: 8\n- SIZE / LEGAL / SIGNAL / LPR / CONTACT: 5 / 4 / 3 / 2 / 2\n- Qualified: 2\n- Duplicates: 6\n- Excluded: 32\n- Integrity: PASS\n- Orphan contacts/evidence: 0/0\n- Outreach: 0\n- New: Домоведовъ; Рапид Био / Rapid Bio\n',encoding='utf-8')
          cfg=R/'CURRENT_WORKING_CONFIG.md'; s=cfg.read_text(encoding='utf-8')
          s=s.replace('## RUN 297 — 2026-08-21\nPhysical canonical/contactable: 192/192. Added 0. Integrity PASS. Orphan 0/0. Outreach 0.\n','')
          if '## RUN 297 — verified final' not in s:s+='\n\n## RUN 297 — verified final\nPhysical canonical/contactable: 192/192. Added 2. Raw 40; fast 8; qualified 2. Integrity PASS. Orphan 0/0. Outreach 0.\n'
          cfg.write_text(s,encoding='utf-8')
          print('RUN297_REPAIRED 192/192 +2 PASS')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data reports CURRENT_WORKING_CONFIG.md
          git commit -m 'Growth Radar: repair RUN 297 metadata and shards'
          git push
