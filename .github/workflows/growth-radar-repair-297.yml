name: Growth Radar repair RUN 297
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/growth-radar-repair-297.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate RUN 297 and validate
        shell: bash
        run: |
          python - <<'PY'
          import csv,json,pathlib,re,datetime
          R=pathlib.Path('.'); camp=R/'data/campaigns/new_5000'; run='N5K-20260821-297'
          pending=json.loads((R/'data/runtime/growth_radar_pending_run.json').read_text(encoding='utf-8'))
          assert pending['run_id']==run
          now='2026-08-21T17:05:00+05:00'
          def rows(p):
              with p.open(encoding='utf-8-sig',newline='') as f:return list(csv.DictReader(f))
          def fields(p):
              with p.open(encoding='utf-8-sig',newline='') as f:return next(csv.reader(f))
          def norm(s):return re.sub(r'\s+',' ',(s or '').strip().lower().replace('«','').replace('»',''))
          def dom(s):return norm(re.sub(r'^https?://(www\.)?','',s or '').rstrip('/'))
          def append(p,rr,ff=None):
              if not rr:return
              ff=ff or fields(p)
              with p.open('a',encoding='utf-8',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=ff,extrasaction='ignore',lineterminator='\n')
                  for r in rr:w.writerow({k:r.get(k,'') for k in ff})
          def write(p,rr,ff):
              p.parent.mkdir(parents=True,exist_ok=True)
              with p.open('w',encoding='utf-8',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=ff,extrasaction='ignore',lineterminator='\n');w.writeheader();w.writerows([{k:r.get(k,'') for k in ff} for r in rr])
          lp=camp/'leads_master.csv'; cp=camp/'contactable_master.csv'; xp=camp/'contacts.csv'; ep=camp/'evidence.csv'
          leads=rows(lp); lf,cf,xf,ef=fields(lp),fields(cp),fields(xp),fields(ep)
          inns={norm(r.get('INN')) for r in leads if r.get('INN')}; ogrns={norm(r.get('OGRN/OGRNIP')) for r in leads if r.get('OGRN/OGRNIP')}; legals={norm(r.get('Legal Name')) for r in leads if r.get('Legal Name')}; domains={dom(r.get('Website')) for r in leads if r.get('Website')}; ids={norm(r.get('Lead ID')) for r in leads if r.get('Lead ID')}
          unique=[]; dups=[]
          for c in pending['qualified_companies']:
              why=[]; d=dom(c.get('Website'))
              if norm(c['Lead ID']) in ids: why.append('LEAD_ID')
              if norm(c['INN']) in inns: why.append('INN')
              if norm(c['OGRN/OGRNIP']) in ogrns: why.append('OGRN')
              if norm(c['Legal Name']) in legals: why.append('LEGAL')
              if d and d in domains: why.append('DOMAIN')
              (dups if why else unique).append((c,why) if why else c)
          masters=[]; contacts=[]; evidence=[]
          for c in unique:
              m={'Lead ID':c['Lead ID'],'Brand':c['Brand'],'Legal Name':c['Legal Name'],'INN':c['INN'],'OGRN/OGRNIP':c['OGRN/OGRNIP'],'Legal Status':'Действует','Region':c.get('Region',''),'City':c.get('City',''),'Segment':c.get('Segment',''),'Website':c.get('Website',''),'Revenue/Scale':c.get('Revenue/Scale',''),'Signal Level':c.get('Signal Level',''),'Signal Summary':c.get('Signal Summary',''),'Signal Date':c.get('Signal Date',''),'Signal Source':c.get('Signal Source',''),'Owner':c.get('Owner',''),'CEO':c.get('CEO',''),'LPR':c.get('LPR',''),'LPR Role':c.get('LPR Role',''),'Primary Phone':c.get('Primary Phone',''),'Primary Email':c.get('Primary Email',''),'HH Contact':c.get('HH Contact',''),'Contact Form':c.get('Contact Form',''),'Contact Type':c.get('Contact Type',''),'Contact Source':c.get('Contact Source',''),'Number Of Contacts Found':str(len(c.get('contacts',[]))),'Consulting Hypothesis':c.get('Consulting Hypothesis',''),'Final Quick Status':'МОЖНО СВЯЗЫВАТЬСЯ','Added At':now,'Updated At':now,'Run ID':run,'Campaign ID':'new_5000'}
              masters.append(m)
              for i,x in enumerate(c.get('contacts',[]),1): contacts.append({'Lead ID':c['Lead ID'],'Contact ID':f"{c['Lead ID']}-C{i:02d}",'Brand':c['Brand'],'INN':c['INN'],'Person Name':c.get('LPR','') if x.get('is_lpr') else '','Person Role':c.get('LPR Role','') if x.get('is_lpr') else 'Корпоративный маршрут','Contact Value':x.get('value',''),'Contact Channel':x.get('channel',''),'Contact Type':x.get('type',''),'Contact Source':x.get('source',''),'Source URL':x.get('url',''),'Is LPR':'YES' if x.get('is_lpr') else 'NO','Reliability':'HIGH','Date Checked':'2026-08-21','Notes':x.get('notes',''),'Run ID':run,'Campaign ID':'new_5000'})
              for i,e in enumerate(c.get('evidence',[]),1): evidence.append({'Lead ID':c['Lead ID'],'Evidence ID':f"{c['Lead ID']}-E{i:02d}",'Evidence Type':e.get('type',''),'Claim':e.get('claim',''),'Source URL':e.get('url',''),'Source Name':e.get('source',''),'Checked At':now,'Reliability':'HIGH','Run ID':run,'Campaign ID':'new_5000'})
          append(lp,masters,lf); append(cp,masters,cf); append(xp,contacts,xf); append(ep,evidence,ef)
          write(camp/'increments'/f'leads_{run}.csv',masters,lf); write(camp/'increments'/f'contacts_{run}.csv',contacts,xf); write(camp/'increments'/f'evidence_{run}.csv',evidence,ef)
          write(camp/'master_shards'/f'leads_{run}.csv',masters,lf); write(camp/'contactable_shards'/f'contactable_{run}.csv',masters,cf); write(camp/'contact_shards'/f'contacts_{run}.csv',contacts,xf); write(camp/'evidence_shards'/f'evidence_{run}.csv',evidence,ef)
          m2,c2,x2,e2=rows(lp),rows(cp),rows(xp),rows(ep); mids={r['Lead ID'] for r in m2}; cids={r['Lead ID'] for r in c2}
          assert len(m2)==len({norm(r['INN']) for r in m2})==len({norm(r['OGRN/OGRNIP']) for r in m2}); assert mids==cids; assert not ({r['Lead ID'] for r in x2}-mids); assert not ({r['Lead ID'] for r in e2}-mids)
          n=len(m2); f=pending['funnel']; q=len(unique); dup=f['duplicates']+len(dups); excl=f['excluded']
          rf=['Run ID','Campaign ID','Status','Discovered','Fast Gate Passed','Size Check Passed','Legal Match Passed','Signal Confirmed','LPR Identified','Contact Route Found','Qualified','Duplicates','Excluded','Canonical Count','Contactable Count','Integrity','Orphan Contacts','Orphan Evidence','Outreach Sent','Notes']
          rr={'Run ID':run,'Campaign ID':'new_5000','Status':'COMPLETED','Discovered':f['discovered'],'Fast Gate Passed':f['fast_gate_passed'],'Size Check Passed':f['size_check_passed'],'Legal Match Passed':f['legal_match_passed'],'Signal Confirmed':f['signal_confirmed'],'LPR Identified':f['lpr_identified'],'Contact Route Found':f['contact_route_found'],'Qualified':q,'Duplicates':dup,'Excluded':excl,'Canonical Count':n,'Contactable Count':len(c2),'Integrity':'PASS','Orphan Contacts':0,'Orphan Evidence':0,'Outreach Sent':0,'Notes':pending['notes']}
          write(camp/'run_logs'/f'{run}.csv',[rr],rf)
          tail=camp/'run_log_tail_198_onward.csv'
          if tail.exists(): append(tail,[rr],fields(tail))
          status={'run_id':run,'campaign_id':'new_5000','status':'COMPLETED','updated_at':now,'stage':'COMPLETE','new_cycle':{'baseline_count':190,'target_count':5000,'current_canonical_count':n,'current_contactable_count':len(c2),'progress_added':n,'remaining':5000-n},'funnel':{'discovered':f['discovered'],'fast_gate_passed':f['fast_gate_passed'],'size_check_passed':f['size_check_passed'],'legal_match_passed':f['legal_match_passed'],'signal_confirmed':f['signal_confirmed'],'lpr_identified':f['lpr_identified'],'contact_route_found':f['contact_route_found'],'qualified':q,'duplicates':dup,'excluded':excl},'qualified_companies':[c['Brand'] for c in unique],'duplicate_rejected':[c['Brand']+' — '+','.join(w) for c,w in dups],'integrity_status':'PASS','orphan_contacts':0,'orphan_evidence':0,'active_wip':0,'physical_master_state':f'{n}_DATA_ROWS_PLUS_HEADER_CONFIRMED','physical_contactable_state':f'{len(c2)}_DATA_ROWS_PLUS_HEADER_CONFIRMED','outreach_sent':0,'blocker':None}
          (R/'data/runtime/current_run_status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          target={'campaign_id':'new_5000','baseline_count':0,'total_target':5000,'current_canonical_count':n,'current_contactable_count':len(c2),'progress_added':n,'remaining_to_total_target':5000-n,'remaining':5000-n,'qualified_staged_not_counted':0,'integrity_status':'PASS','campaign_status':'ACTIVE','updated_at':now,'namespace':'data/campaigns/new_5000','last_completed_run_id':run,'current_run_id':run,'last_run_id':run,'latest_completed_run':run,'orphan_contacts':0,'orphan_evidence':0,'note':f'RUN 297 completed; added {q}; physical canonical/contactable {n}/{len(c2)}; integrity PASS; orphan 0/0; outreach 0.'}
          (R/'data/runtime/campaign_target.json').write_text(json.dumps(target,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          rp=R/'reports'/f'run_2026-08-21_297.md'; rp.parent.mkdir(exist_ok=True); rp.write_text(f'# Growth Radar RUN 297\n\n- Baseline: 190\n- Added: {q}\n- Canonical/contactable: {n}/{len(c2)}\n- Discovered: {f["discovered"]}\n- Fast gate: {f["fast_gate_passed"]}\n- Qualified: {q}\n- Duplicates: {dup}\n- Excluded: {excl}\n- Integrity: PASS\n- Orphan contacts/evidence: 0/0\n- Outreach: 0\n- New: '+', '.join(c['Brand'] for c in unique)+'\n',encoding='utf-8')
          cfg=R/'CURRENT_WORKING_CONFIG.md'
          if cfg.exists(): cfg.write_text(cfg.read_text(encoding='utf-8')+f'\n\n## RUN 297 — 2026-08-21\nPhysical canonical/contactable: {n}/{len(c2)}. Added {q}. Integrity PASS. Orphan 0/0. Outreach 0.\n',encoding='utf-8')
          print(json.dumps({'added':q,'duplicates':len(dups),'count':n},ensure_ascii=False))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data reports CURRENT_WORKING_CONFIG.md
          git commit -m 'Growth Radar: complete RUN 297' || true
          git push
