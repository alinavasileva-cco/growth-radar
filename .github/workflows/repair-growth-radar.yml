name: Repair Growth Radar canonical data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-growth-radar.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and validate canonical database
        run: python scripts/repair_growth_radar.py
      - name: Commit repaired canonical data
        run: |
          git config user.name 'growth-radar-repair-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore and validate Growth Radar canonical database'
          git push
