name: Growth Radar repair RUN 296
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/growth-radar-repair-296.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate pending RUN 296 with physical dedup and integrity
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, pathlib, re
          ROOT=pathlib.Path('.')
          camp=ROOT/'data/campaigns/new_5000'
          pending_path=ROOT/'data/runtime/growth_radar_pending_run.json'
          run_id='N5K-20260821-296'
          pending=json.loads(pending_path.read_text(encoding='utf-8'))
          assert pending.get('run_id')==run_id, pending.get('run_id')
          now=pending['updated_at']
          def read_csv(p):
              with p.open('r',encoding='utf-8-sig',newline='') as f: return list(csv.DictReader(f))
          def fields_of(p):
              with p.open('r',encoding='utf-8-sig',newline='') as f: return next(csv.reader(f))
          def append_rows(p,rows,fields=None):
              if not rows:return
              if fields is None: fields=fields_of(p)
              with p.open('a',encoding='utf-8',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=fields,extrasaction='ignore',lineterminator='\n')
                  for r in rows:w.writerow({k:r.get(k,'') for k in fields})
          def write_csv(p,rows,fields):
              p.parent.mkdir(parents=True,exist_ok=True)
              with p.open('w',encoding='utf-8',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=fields,extrasaction='ignore',lineterminator='\n');w.writeheader();w.writerows([{k:r.get(k,'') for k in fields} for r in rows])
          def norm(s): return re.sub(r'\s+',' ',(s or '').strip().lower().replace('«','').replace('»',''))
          def domain(s): return norm(re.sub(r'^https?://(www\.)?','',s or '').rstrip('/'))
          leads_path=camp/'leads_master.csv'; cont_path=camp/'contactable_master.csv'; contacts_path=camp/'contacts.csv'; ev_path=camp/'evidence.csv'
          leads=read_csv(leads_path)
          existing_inn={norm(r.get('INN')) for r in leads if r.get('INN')}
          existing_ogrn={norm(r.get('OGRN/OGRNIP')) for r in leads if r.get('OGRN/OGRNIP')}
          existing_legal={norm(r.get('Legal Name')) for r in leads if r.get('Legal Name')}
          existing_domain={domain(r.get('Website')) for r in leads if r.get('Website')}
          existing_id={norm(r.get('Lead ID')) for r in leads if r.get('Lead ID')}
          unique=[]; duplicates=[]
          for c in pending.get('qualified_companies',[]):
              reasons=[]; d=domain(c.get('Website'))
              if norm(c.get('Lead ID')) in existing_id: reasons.append('LEAD_ID')
              if norm(c.get('INN')) in existing_inn: reasons.append('INN')
              if norm(c.get('OGRN/OGRNIP')) in existing_ogrn: reasons.append('OGRN')
              if norm(c.get('Legal Name')) in existing_legal: reasons.append('LEGAL')
              if d and d in existing_domain: reasons.append('DOMAIN')
              if reasons: duplicates.append((c,reasons))
              else: unique.append(c)
          lead_fields=fields_of(leads_path); cont_fields=fields_of(cont_path); contacts_fields=fields_of(contacts_path); ev_fields=fields_of(ev_path)
          master_rows=[]; cont_rows=[]; contact_rows=[]; ev_rows=[]
          for c in unique:
              m={'Lead ID':c['Lead ID'],'Brand':c['Brand'],'Legal Name':c['Legal Name'],'INN':c['INN'],'OGRN/OGRNIP':c['OGRN/OGRNIP'],'Legal Status':'Действует','Region':c.get('Region',''),'City':c.get('City',''),'Segment':c.get('Segment',''),'Website':c.get('Website',''),'Revenue/Scale':c.get('Revenue/Scale',''),'Signal Level':c.get('Signal Level',''),'Signal Summary':c.get('Signal Summary',''),'Signal Date':c.get('Signal Date',''),'Signal Source':c.get('Signal Source',''),'Owner':c.get('Owner',''),'CEO':c.get('CEO',''),'LPR':c.get('LPR',''),'LPR Role':c.get('LPR Role',''),'Primary Phone':c.get('Primary Phone',''),'Primary Email':c.get('Primary Email',''),'HH Contact':c.get('HH Contact',''),'Contact Form':c.get('Contact Form',''),'Contact Type':c.get('Contact Type',''),'Contact Source':c.get('Contact Source',''),'Number Of Contacts Found':str(len(c.get('contacts',[]))),'Consulting Hypothesis':c.get('Consulting Hypothesis',''),'Final Quick Status':'МОЖНО СВЯЗЫВАТЬСЯ','Added At':now,'Updated At':now,'Run ID':run_id,'Campaign ID':'new_5000'}
              master_rows.append(m)
              cr={k:m.get(k,'') for k in cont_fields};cr.update({'Telegram':'','VK':'','Other Contact':'','Final Quick Status':'МОЖНО СВЯЗЫВАТЬСЯ','Added At':now,'Updated At':now,'Run ID':run_id,'Campaign ID':'new_5000'});cont_rows.append(cr)
              for i,x in enumerate(c.get('contacts',[]),1):
                  contact_rows.append({'Lead ID':c['Lead ID'],'Contact ID':f"{c['Lead ID']}-C{i:02d}",'Brand':c['Brand'],'INN':c['INN'],'Person Name':c.get('LPR','') if x.get('is_lpr') else '','Person Role':c.get('LPR Role','') if x.get('is_lpr') else 'Корпоративный маршрут','Contact Value':x.get('value',''),'Contact Channel':x.get('channel',''),'Contact Type':x.get('type',''),'Contact Source':x.get('source',''),'Source URL':x.get('url',''),'Is LPR':'YES' if x.get('is_lpr') else 'NO','Reliability':'HIGH','Date Checked':'2026-08-21','Notes':x.get('notes',''),'Run ID':run_id,'Campaign ID':'new_5000'})
              for i,e in enumerate(c.get('evidence',[]),1):
                  ev_rows.append({'Lead ID':c['Lead ID'],'Evidence ID':f"{c['Lead ID']}-E{i:02d}",'Evidence Type':e.get('type',''),'Claim':e.get('claim',''),'Source URL':e.get('url',''),'Source Name':e.get('source',''),'Checked At':now,'Reliability':'HIGH','Run ID':run_id,'Campaign ID':'new_5000'})
          append_rows(leads_path,master_rows,lead_fields);append_rows(cont_path,cont_rows,cont_fields);append_rows(contacts_path,contact_rows,contacts_fields);append_rows(ev_path,ev_rows,ev_fields)
          write_csv(camp/'increments'/f'leads_{run_id}.csv',master_rows,lead_fields);write_csv(camp/'increments'/f'contacts_{run_id}.csv',contact_rows,contacts_fields);write_csv(camp/'increments'/f'evidence_{run_id}.csv',ev_rows,ev_fields)
          write_csv(camp/'master_shards'/f'leads_{run_id}.csv',master_rows,lead_fields);write_csv(camp/'contactable_shards'/f'contactable_{run_id}.csv',cont_rows,cont_fields);write_csv(camp/'contact_shards'/f'contacts_{run_id}.csv',contact_rows,contacts_fields);write_csv(camp/'evidence_shards'/f'evidence_{run_id}.csv',ev_rows,ev_fields)
          master2=read_csv(leads_path);cont2=read_csv(cont_path);contacts2=read_csv(contacts_path);ev2=read_csv(ev_path)
          mids={r['Lead ID'] for r in master2};cids={r['Lead ID'] for r in cont2}
          assert len(master2)==len({norm(r['INN']) for r in master2})==len({norm(r['OGRN/OGRNIP']) for r in master2})
          assert mids==cids
          assert not ({r['Lead ID'] for r in contacts2}-mids)
          assert not ({r['Lead ID'] for r in ev2}-mids)
          new_count=len(master2);f=pending['funnel'];dup_total=f.get('duplicates',0)+len(duplicates);qualified=len(unique);excluded=f.get('excluded',0)
          run_fields=['Run ID','Campaign ID','Status','Discovered','Size Check Passed','Legal Match Passed','Signal Confirmed','LPR Identified','Contact Route Found','Qualified','Duplicates','Excluded','Canonical Count','Contactable Count','Integrity','Orphan Contacts','Orphan Evidence','Outreach Sent','Notes']
          rr={'Run ID':run_id,'Campaign ID':'new_5000','Status':'COMPLETED','Discovered':f['discovered'],'Size Check Passed':f['size_check_passed'],'Legal Match Passed':f['legal_match_passed'],'Signal Confirmed':f['signal_confirmed'],'LPR Identified':f['lpr_identified'],'Contact Route Found':f['contact_route_found'],'Qualified':qualified,'Duplicates':dup_total,'Excluded':excluded,'Canonical Count':new_count,'Contactable Count':len(cont2),'Integrity':'PASS','Orphan Contacts':0,'Orphan Evidence':0,'Outreach Sent':0,'Notes':pending['notes']}
          write_csv(camp/'run_logs'/f'{run_id}.csv',[rr],run_fields);append_rows(camp/'run_log.csv',[rr]);append_rows(camp/'run_log_tail_198_onward.csv',[rr])
          runtime={'run_id':run_id,'campaign_id':'new_5000','status':'COMPLETED','updated_at':now,'stage':'COMPLETE','new_cycle':{'baseline_count':189,'target_count':5000,'current_canonical_count':new_count,'current_contactable_count':len(cont2),'progress_added':new_count,'remaining':5000-new_count},'funnel':{**f,'qualified':qualified,'duplicates':dup_total,'excluded':excluded},'qualified_companies':[c['Brand'] for c in unique],'duplicate_rejected':[f"{c['Brand']} — {','.join(r)}" for c,r in duplicates],'integrity_status':'PASS','orphan_contacts':0,'orphan_evidence':0,'active_wip':0,'physical_master_state':f'{new_count}_DATA_ROWS_PLUS_HEADER_CONFIRMED','physical_contactable_state':f'{len(cont2)}_DATA_ROWS_PLUS_HEADER_CONFIRMED','outreach_sent':0,'blocker':None}
          (ROOT/'data/runtime/current_run_status.json').write_text(json.dumps(runtime,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          target=json.loads((ROOT/'data/runtime/campaign_target.json').read_text(encoding='utf-8'));target.update({'current_canonical_count':new_count,'current_contactable_count':len(cont2),'progress_added':new_count,'remaining_to_total_target':5000-new_count,'remaining':5000-new_count,'qualified_staged_not_counted':0,'integrity_status':'PASS','campaign_status':'ACTIVE','updated_at':now,'last_completed_run_id':run_id,'current_run_id':run_id,'last_run_id':run_id,'latest_completed_run':run_id,'orphan_contacts':0,'orphan_evidence':0,'note':f'RUN 296 completed; added {qualified}; physical canonical/contactable {new_count}/{len(cont2)}; integrity PASS; orphan 0/0; outreach 0.'});(ROOT/'data/runtime/campaign_target.json').write_text(json.dumps(target,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          report=ROOT/'reports'/f'run_2026_08_21_296.md';report.write_text(f'# Growth Radar RUN {run_id}\n\n- Status: COMPLETED\n- Added: {qualified}\n- Canonical/contactable: {new_count}/{len(cont2)}\n- Discovered: {f["discovered"]}\n- Fast gate: {f["fast_gate_passed"]}\n- Qualified: {qualified}\n- Duplicates: {dup_total}\n- Excluded: {excluded}\n- Integrity: PASS\n- Orphan contacts/evidence: 0/0\n- Outreach: 0\n\n## Added companies\n'+''.join(f'- {c["Brand"]} — INN {c["INN"]}\n' for c in unique),encoding='utf-8')
          cfg=ROOT/'CURRENT_WORKING_CONFIG.md';text=cfg.read_text(encoding='utf-8');text=re.sub(r'\*\*Версия:\*\*.*',f'**Версия:** {now}  ',text,1);text=re.sub(r'\*\*Последний полностью завершённый RUN:\*\*.*',f'**Последний полностью завершённый RUN:** `{run_id}`  ',text,1);text=re.sub(r'\*\*Физически подтверждённый canonical/contactable:\*\*.*',f'**Физически подтверждённый canonical/contactable:** **{new_count} / {len(cont2)}**  ',text,1);text=re.sub(r'\*\*Осталось:\*\*.*',f'**Осталось:** **{5000-new_count}**  ',text,1);cfg.write_text(text+f'\n\n## Latest verified run {run_id}\nCanonical/contactable: {new_count}/{len(cont2)}. Added: {qualified}. Integrity PASS. Orphan contacts/evidence: 0/0. Outreach: 0.\n',encoding='utf-8')
          print(json.dumps({'added':[c['Brand'] for c in unique],'duplicates':[(c['Brand'],r) for c,r in duplicates],'count':new_count},ensure_ascii=False))
          PY
      - name: Commit repaired run
        run: |
          git config user.name "growth-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/campaigns/new_5000 data/runtime CURRENT_WORKING_CONFIG.md reports
          git commit -m "Growth Radar RUN 296: integrate verified candidates" || exit 0
          git push
