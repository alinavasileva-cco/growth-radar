name: Growth Radar integrate pending run

on:
  push:
    paths:
      - 'data/runtime/growth_radar_pending_run.json'
      - '.github/workflows/growth_radar_integrate_pending.yml'
      - 'scripts/integrate_pending_run.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: growth-radar-integrate-pending
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Integrate pending run with hard completion gate
        run: python scripts/integrate_pending_run.py

      - name: Validate Growth Radar state
        run: |
          if [ -f scripts/validate_growth_radar.py ]; then
            python scripts/validate_growth_radar.py || exit 1
          fi

      - name: Commit integrated run state
        run: |
          git config user.name "growth-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/campaigns/new_5000 data/runtime data/run_metrics.json CURRENT_WORKING_CONFIG.md reports scripts/integrate_pending_run.py
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi
          git commit -m "Growth Radar: integrate pending run with hard gate"
          git pull --rebase origin main
          git push
