name: Growth Radar RUN 474 same-cycle repair
on:
  push:
    paths:
      - '.github/workflows/growth_radar_run474_repair.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair RUN 474 metadata, consumed index, and canonical config
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          root = Path('.')
          camp = root / 'data/campaigns/new_5000'
          run_id = 'N5K-20260828-474'
          # Physical integration commit a882ce89... was committed at 2026-08-28T10:06:10Z.
          fixed_at = '2026-08-28T13:06:10+03:00'

          def read_csv(path):
              with path.open('r', encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f))

          def write_csv(path, rows):
              if not rows:
                  return
              fields = list(rows[0].keys())
              with path.open('w', encoding='utf-8', newline='') as f:
                  w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
                  w.writeheader(); w.writerows(rows)

          # Repair timestamps propagated from an incorrect future pending timestamp.
          for rel, fields in [
              ('leads_master.csv', ['Added At','Updated At']),
              ('contactable_master.csv', ['Added At','Updated At']),
              (f'master_shards/{run_id}.csv', ['Added At','Updated At']),
              (f'contactable_shards/{run_id}.csv', ['Added At','Updated At']),
              ('evidence.csv', ['Checked At']),
              (f'evidence_shards/{run_id}.csv', ['Checked At']),
          ]:
              p = camp / rel
              if not p.exists():
                  continue
              rows = read_csv(p)
              changed = False
              for r in rows:
                  if r.get('Run ID') == run_id:
                      for fld in fields:
                          if fld in r and r[fld] != fixed_at:
                              r[fld] = fixed_at; changed = True
              if changed:
                  write_csv(p, rows)

          for rel, key in [
              ('data/runtime/current_run_status.json','updated_at'),
              ('data/runtime/campaign_target.json','updated_at'),
              ('data/runtime/growth_radar_pending_run.json','updated_at'),
              ('data/run_metrics.json','generated_at'),
          ]:
              p = root / rel
              obj = json.loads(p.read_text(encoding='utf-8'))
              obj[key] = fixed_at
              p.write_text(json.dumps(obj, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Record worker staging consumption without deleting immutable audit evidence.
          consumed = {
              'run_id': run_id,
              'recorded_at': fixed_at,
              'canonical_head_before_repair': 'a882ce89d7b31e3fea1c2a555f9beb8d7e3496b0',
              'workers': [
                  {
                      'worker': 'jobs',
                      'path': 'data/pending_workers/jobs/20260828-122700-jobs.json',
                      'blob_sha': 'd4b99562aea1b4600ada1bfcb0ff016a054aea20',
                      'status': 'CONSUMED_DUPLICATE',
                      'result': 'Worker-qualified NTA rejected by physical canonical dedup as existing N5K-0521 (INN 9718218994, OGRN 1237700121075).'
                  },
                  {
                      'worker': 'industry',
                      'path': 'data/pending_workers/industry/20260828-123334-industry.json',
                      'blob_sha': '47c8d414f63af48e88973098f4dbc464fa1a8bd7',
                      'status': 'CONSUMED_INTEGRATED',
                      'result': 'Energo-Arsenal / ITM integrated as N5K-0645.'
                  }
              ],
              'immutable_staging_preserved': True,
              'outreach': False
          }
          cp = root / f'data/runtime/worker_consumed_indexes/{run_id}.json'
          cp.parent.mkdir(parents=True, exist_ok=True)
          cp.write_text(json.dumps(consumed, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Repair authoritative top summary without altering qualification rules/history.
          cfg = root / 'CURRENT_WORKING_CONFIG.md'
          text = cfg.read_text(encoding='utf-8')
          replacements = [
              ('**Версия:** 2026-08-28T12:00:24+03:00', '**Версия:** 2026-08-28T13:06:10+03:00'),
              ('**Последний полностью завершённый RUN:** `N5K-20260828-473`', '**Последний полностью завершённый RUN:** `N5K-20260828-474`'),
              ('**Физически подтверждённый canonical/contactable:** **487 / 487**', '**Физически подтверждённый canonical/contactable:** **488 / 488**'),
              ('**Осталось до 1000:** **513**', '**Осталось до 1000:** **512**'),
              ('**Осталось до 5000:** **4513**', '**Осталось до 5000:** **4512**'),
              ('- physical canonical/contactable count: **487 / 487**;', '- physical canonical/contactable count: **488 / 488**;'),
              ('- последний завершённый RUN: `N5K-20260828-473`;', '- последний завершённый RUN: `N5K-20260828-474`;'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected config token not found: {old}')
              text = text.replace(old, new, 1)
          cfg.write_text(text, encoding='utf-8')

          # Physical guard after repair.
          master = read_csv(camp/'leads_master.csv')
          contactable = read_csv(camp/'contactable_master.csv')
          contacts = read_csv(camp/'contacts.csv')
          evidence = read_csv(camp/'evidence.csv')
          assert len(master) == 488 and len(contactable) == 488
          assert {r['Lead ID'] for r in master} == {r['Lead ID'] for r in contactable}
          assert len([r for r in master if r.get('INN') == '6674369395']) == 1
          assert len([r for r in master if r.get('OGRN/OGRNIP') == '1106674022729']) == 1
          mids = {r['Lead ID'] for r in master}
          assert not ({r['Lead ID'] for r in contacts} - mids)
          assert not ({r['Lead ID'] for r in evidence} - mids)
          assert len([r for r in contacts if r.get('Lead ID') == 'N5K-0645']) == 3
          assert len([r for r in evidence if r.get('Lead ID') == 'N5K-0645']) >= 5
          PY
      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name "growth-radar-canonical-writer"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/growth_radar_run474_repair.yml
          git add CURRENT_WORKING_CONFIG.md data/runtime data/run_metrics.json data/campaigns/new_5000
          git commit -m "Growth Radar RUN 474 same-cycle metadata and consumed repair"
          git push
