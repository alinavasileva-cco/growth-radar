name: Growth Radar build canonical dedup index

on:
  push:
    paths:
      - 'data/campaigns/new_5000/leads_master.csv'
      - 'data/campaigns/new_5000/contactable_master.csv'
      - 'scripts/build_canonical_dedup_index.py'
      - '.github/workflows/growth_radar_build_dedup_index.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: growth-radar-build-dedup-index
  cancel-in-progress: true

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact physical canonical dedup index
        run: python scripts/build_canonical_dedup_index.py
      - name: Commit dedup index
        run: |
          git config user.name "growth-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/runtime/canonical_dedup_index.json
          if git diff --cached --quiet; then
            echo "Dedup index already current."
            exit 0
          fi
          git commit -m "Growth Radar: refresh canonical dedup index"
          git pull --rebase origin main
          git push
