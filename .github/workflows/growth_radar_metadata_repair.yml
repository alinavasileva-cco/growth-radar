name: Growth Radar metadata repair
on:
  push:
    paths:
      - '.github/workflows/growth_radar_metadata_repair.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair current-state metadata only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('CURRENT_WORKING_CONFIG.md')
          s = p.read_text(encoding='utf-8')
          replacements = [
              (r'\*\*Версия:\*\* .*?  $', '**Версия:** 2026-09-02T05:26:59+03:00  '),
              (r'\*\*Последний полностью завершённый RUN:\*\* `[^`]+`  $', '**Последний полностью завершённый RUN:** `N5K-20260902-580`  '),
              (r'\*\*Физически подтверждённый canonical/contactable:\*\* \*\*\d+ / \d+\*\*  $', '**Физически подтверждённый canonical/contactable:** **592 / 592**  '),
              (r'\*\*Осталось до 1000:\*\* \*\*\d+\*\*  $', '**Осталось до 1000:** **408**  '),
              (r'\*\*Осталось до 5000:\*\* \*\*\d+\*\*  $', '**Осталось до 5000:** **4408**  '),
              (r'- physical canonical/contactable count: \*\*\d+ / \d+\*\*;', '- physical canonical/contactable count: **592 / 592**;'),
              (r'- последний завершённый RUN: `[^`]+`;', '- последний завершённый RUN: `N5K-20260902-580`;'),
          ]
          for pat, repl in replacements:
              s, n = re.subn(pat, repl, s, count=1, flags=re.M)
              if n != 1:
                  raise SystemExit(f'Expected one replacement for {pat!r}, got {n}')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name "growth-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add CURRENT_WORKING_CONFIG.md
          git commit -m "Growth Radar: sync current-state metadata" || exit 0
          git pull --rebase origin main
          git push
