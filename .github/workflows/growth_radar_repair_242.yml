name: Growth Radar physical consolidation RUN 242
on:
  push:
    paths:
      - '.github/workflows/growth_radar_repair_242.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct and strictly deduplicate canonical pool
        run: |
          python - <<'PY'
          import csv,json,re
          from pathlib import Path
          from datetime import datetime,timezone
          from urllib.parse import urlparse
          ROOT=Path('data/campaigns/new_5000'); RUN='N5K-20260815-242'; now=datetime.now(timezone.utc).isoformat()
          def rc(p):
              p=Path(p)
              if not p.exists() or not p.stat().st_size:return [],[]
              try:
                  with p.open(encoding='utf-8-sig',newline='') as f:r=csv.DictReader(f);return list(r.fieldnames or []),list(r)
              except:return [],[]
          def wc(p,flds,rows):
              p=Path(p);p.parent.mkdir(parents=True,exist_ok=True)
              with p.open('w',encoding='utf-8',newline='') as f:w=csv.DictWriter(f,fieldnames=flds,extrasaction='ignore');w.writeheader();w.writerows(rows)
          def num(v):
              m=re.search(r'(\d+)$',v or '');return int(m.group(1)) if m else 10**9
          def norm(v):return re.sub(r'[^0-9a-zа-яё]+','',(v or '').lower())
          def domain(v):
              if not v:return ''
              x=v.strip();x=x if '://' in x else 'https://'+x
              try:
                  h=(urlparse(x).hostname or '').lower();return h[4:] if h.startswith('www.') else h
              except:return ''
          mf,_=rc(ROOT/'leads_master.csv');cf,oldc=rc(ROOT/'contactable_master.csv')
          if not mf or not cf:raise SystemExit('missing schemas')
          paths=[ROOT/'leads_master.csv',ROOT/'contactable_master.csv']+sorted((ROOT/'master_shards').glob('*.csv'))+sorted((ROOT/'contactable_shards').glob('*.csv'))+sorted((ROOT/'increments').glob('*.csv'))
          def pri(p,fields):
              s=str(p)
              if s.endswith('/leads_master.csv'):return 100
              if '/master_shards/' in s:return 90
              if '/increments/' in s and ('Revenue/Scale' in fields or '_leads.csv' in s):return 80
              if s.endswith('/contactable_master.csv'):return 70
              if '/contactable_shards/' in s:return 60
              return 40
          records={};fieldpri={};fresh={}
          for p in paths:
              fields,rows=rc(p);fs=set(fields)
              if not {'Lead ID','Brand','Legal Name','INN'}.issubset(fs):continue
              if not ({'Revenue/Scale','Signal Summary','Final Quick Status'}&fs):continue
              q=pri(p,fields)
              for raw in rows:
                  lid=(raw.get('Lead ID') or '').strip()
                  if not re.fullmatch(r'N5K-\d{4}',lid):continue
                  dst=records.setdefault(lid,{k:'' for k in mf});pm=fieldpri.setdefault(lid,{k:-1 for k in mf})
                  stamp=(raw.get('Updated At') or raw.get('Added At') or '')
                  fresh[lid]=max(fresh.get(lid,''),stamp)
                  for k in mf:
                      src='OGRN / OGRNIP' if k=='OGRN/OGRNIP' and not raw.get(k) else k
                      val=(raw.get(src) or '').strip()
                      if val and q>=pm[k]:dst[k]=val;pm[k]=q
                  dst['Lead ID']=lid;dst['Campaign ID']='new_5000'
          if len(records)!=255:raise SystemExit(f'reconstructed {len(records)} cards, expected historical 255 before dedup')
          lids=sorted(records,key=num);parent={x:x for x in lids}
          def find(x):
              while parent[x]!=x:parent[x]=parent[parent[x]];x=parent[x]
              return x
          def union(a,b):
              a,b=find(a),find(b)
              if a!=b:parent[b]=a
          keymaps={'inn':{},'ogrn':{},'legal':{},'brand_domain':{}}
          for lid in lids:
              r=records[lid]
              keys={'inn':(r.get('INN') or '').strip(),'ogrn':(r.get('OGRN/OGRNIP') or '').strip(),'legal':norm(r.get('Legal Name')),'brand_domain':(norm(r.get('Brand')),domain(r.get('Website')))}
              for typ,k in keys.items():
                  if not k or k==('',''):continue
                  if k in keymaps[typ]:union(lid,keymaps[typ][k])
                  else:keymaps[typ][k]=lid
          comps={}
          for lid in lids:comps.setdefault(find(lid),[]).append(lid)
          # Select freshest card in each duplicate component; tie -> highest Lead ID. Merge missing fields only from older cards.
          repmap={};canon=[];dupmap=[]
          for members in comps.values():
              members=sorted(members,key=lambda x:(fresh.get(x,''),num(x)),reverse=True);rep=members[0]
              out=dict(records[rep])
              for old in members[1:]:
                  for k in mf:
                      if not out.get(k,'').strip() and records[old].get(k,'').strip():out[k]=records[old][k]
              out['Lead ID']=rep;out['Final Quick Status']='МОЖНО СВЯЗЫВАТЬСЯ';out['Campaign ID']='new_5000';canon.append(out)
              for x in members:repmap[x]=rep
              if len(members)>1:dupmap.append({'representative':rep,'merged_ids':members,'inn':out.get('INN',''),'legal_name':out.get('Legal Name',''),'brand':out.get('Brand','')})
          canon.sort(key=lambda r:num(r['Lead ID']));COUNT=len(canon)
          # Verify no duplicates remain by mandatory identifiers.
          def dup(field,fn=lambda x:(x or '').strip()):
              d={}
              for r in canon:
                  v=fn(r.get(field,''));
                  if v:d.setdefault(v,[]).append(r['Lead ID'])
              return {k:v for k,v in d.items() if len(v)>1}
          bad={'inn':dup('INN'),'ogrn':dup('OGRN/OGRNIP'),'legal':dup('Legal Name',norm)}
          bd={}
          for r in canon:
              k=(norm(r.get('Brand')),domain(r.get('Website')))
              if all(k):bd.setdefault(k,[]).append(r['Lead ID'])
          bad['brand_domain']={str(k):v for k,v in bd.items() if len(v)>1};bad={k:v for k,v in bad.items() if v}
          if bad:raise SystemExit('dedup failed '+json.dumps(bad,ensure_ascii=False))
          crit=['Brand','Legal Name','INN','Revenue/Scale','Signal Level','Signal Summary','LPR']
          incomplete={r['Lead ID']:[k for k in crit if not (r.get(k) or '').strip()] for r in canon};incomplete={k:v for k,v in incomplete.items() if v}
          if incomplete:raise SystemExit('incomplete canonical cards '+json.dumps(incomplete,ensure_ascii=False))
          wc(ROOT/'leads_master.csv',mf,canon)
          old_by={r.get('Lead ID',''):r for r in oldc};contactable=[]
          for m in canon:
              o={}
              # Prefer direct representative contactable record, then any merged historical alias.
              aliases=[x for x,y in repmap.items() if y==m['Lead ID']]
              for a in sorted(aliases,key=num,reverse=True):
                  if a in old_by:
                      for k,v in old_by[a].items():
                          if v and not o.get(k):o[k]=v
              r={k:'' for k in cf}
              for k in cf:
                  if m.get(k):r[k]=m[k]
                  elif o.get(k):r[k]=o[k]
              r['Lead ID']=m['Lead ID'];r['Final Quick Status']='МОЖНО СВЯЗЫВАТЬСЯ';r['Campaign ID']='new_5000';contactable.append(r)
          wc(ROOT/'contactable_master.csv',cf,contactable)
          ids={r['Lead ID'] for r in canon}
          # Remap and consolidate contacts from duplicate historical IDs onto representatives.
          kf,base=rc(ROOT/'contacts.csv');allc=list(base)
          for p in list((ROOT/'contact_shards').glob('*.csv'))+list((ROOT/'increments').glob('*_contacts.csv')):
              _,rr=rc(p);allc.extend(rr)
          seen=set();contacts=[]
          for raw in allc:
              old=(raw.get('Lead ID') or '').strip();lid=repmap.get(old)
              if not lid or lid not in ids:continue
              x={k:(raw.get(k) or '') for k in kf};x['Lead ID']=lid;x['Campaign ID']='new_5000'
              key=(lid,x.get('Contact Value','').strip().lower(),x.get('Contact Channel','').strip().lower(),x.get('Source URL','').strip())
              if key in seen or (not key[1] and not key[3]):continue
              seen.add(key);contacts.append(x)
          contacts.sort(key=lambda r:(num(r.get('Lead ID')),r.get('Contact Channel',''),r.get('Contact Value','')));used=set();seq=1
          for r in contacts:
              cid=(r.get('Contact ID') or '').strip()
              if not cid or cid in used:
                  while f'N5K-C-{seq:04d}' in used:seq+=1
                  cid=f'N5K-C-{seq:04d}';seq+=1
              r['Contact ID']=cid;used.add(cid)
          wc(ROOT/'contacts.csv',kf,contacts)
          ef,basee=rc(ROOT/'evidence.csv');alle=list(basee)
          for p in list((ROOT/'evidence_shards').glob('*.csv'))+list((ROOT/'increments').glob('*_evidence.csv')):
              _,rr=rc(p);alle.extend(rr)
          seen=set();evidence=[]
          for raw in alle:
              old=(raw.get('Lead ID') or '').strip();lid=repmap.get(old)
              if not lid or lid not in ids:continue
              x={k:(raw.get(k) or '') for k in ef};x['Lead ID']=lid;x['Campaign ID']='new_5000'
              key=(lid,x.get('Evidence Type','').strip().lower(),x.get('Claim','').strip(),x.get('Source URL','').strip())
              if key in seen or (not key[2] and not key[3]):continue
              seen.add(key);evidence.append(x)
          evidence.sort(key=lambda r:(num(r.get('Lead ID')),r.get('Evidence Type',''),r.get('Source URL','')));used=set();seq=1
          for r in evidence:
              eid=(r.get('Evidence ID') or '').strip()
              if not eid or eid in used:
                  while f'N5K-E-{seq:04d}' in used:seq+=1
                  eid=f'N5K-E-{seq:04d}';seq+=1
              r['Evidence ID']=eid;used.add(eid)
          wc(ROOT/'evidence.csv',ef,evidence)
          contact_ids={r.get('Lead ID') for r in contacts};evidence_ids={r.get('Lead ID') for r in evidence}
          no_contact=sorted(ids-contact_ids,key=num);no_evidence=sorted(ids-evidence_ids,key=num)
          if no_contact or no_evidence:raise SystemExit('coverage failure contacts='+str(no_contact)+' evidence='+str(no_evidence))
          _,cm=rc(ROOT/'leads_master.csv');_,cc=rc(ROOT/'contactable_master.csv')
          if len(cm)!=COUNT or len(cc)!=COUNT or len({r['Lead ID'] for r in cm})!=COUNT or len({r['Lead ID'] for r in cc})!=COUNT:raise SystemExit('postwrite count failure')
          report='reports/run_2026-08-16_242_physical_master_repair.md'
          audit={'run_id':RUN,'generated_at':now,'historical_logical_count_before_repair':255,'reconstructed_historical_cards':255,'duplicate_components_merged':len(dupmap),'duplicate_cards_removed':255-COUNT,'corrected_canonical_count':COUNT,'physical_master_count':len(cm),'physical_contactable_count':len(cc),'contacts_count':len(contacts),'evidence_count':len(evidence),'orphan_contacts':0,'orphan_evidence':0,'remaining':5000-COUNT,'integrity':'PASS','outreach_sent':0,'duplicate_map':dupmap}
          Path('data/runtime/repair_242_audit.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          status={'run_id':RUN,'campaign_id':'new_5000','status':'COMPLETED','updated_at':now,'stage':'REPAIR_COMPLETE','repair_only':True,'repair_result':'RECONSTRUCTED_255_HISTORICAL_CARDS_AND_STRICTLY_DEDUPLICATED_BY_INN_OGRN_LEGAL_BRAND_DOMAIN','historical_count_before_repair':255,'new_cycle':{'baseline_count':0,'target_count':5000,'current_canonical_count':COUNT,'current_contactable_count':COUNT,'progress_added':COUNT,'remaining':5000-COUNT},'funnel':{'discovered':0,'size_check_passed':0,'legal_match_passed':0,'signal_confirmed':0,'lpr_identified':0,'contact_route_found':0,'qualified':0,'duplicates':255-COUNT,'excluded':0},'qualified_companies':[],'integrity_status':'PASS','orphan_contacts':0,'orphan_evidence':0,'active_wip':0,'physical_master_count':COUNT,'physical_contactable_count':COUNT,'contacts_count':len(contacts),'evidence_count':len(evidence),'outreach_sent':0,'blocker':None,'report_path':report,'run_log_path':f'data/campaigns/new_5000/run_logs/{RUN}.csv','aggregate_tail_path':'data/campaigns/new_5000/run_log_tail_198_onward.csv'}
          Path('data/runtime/current_run_status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          tp=Path('data/runtime/campaign_target.json');t=json.loads(tp.read_text(encoding='utf-8'));t.update({'campaign_id':'new_5000','current_canonical_count':COUNT,'current_contactable_count':COUNT,'remaining':5000-COUNT,'integrity_status':'PASS','orphan_contacts':0,'orphan_evidence':0,'latest_completed_run':RUN,'updated_at':now});tp.write_text(json.dumps(t,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          lf=['Run ID','Started At','Completed At','Campaign ID','Discovered','Qualified','Duplicates','Excluded','Current Canonical','Current Contactable','Integrity','Orphan Contacts','Orphan Evidence','Report'];lr={'Run ID':RUN,'Started At':now,'Completed At':now,'Campaign ID':'new_5000','Discovered':'0','Qualified':'0','Duplicates':str(255-COUNT),'Excluded':'0','Current Canonical':str(COUNT),'Current Contactable':str(COUNT),'Integrity':'PASS','Orphan Contacts':'0','Orphan Evidence':'0','Report':report};wc(ROOT/'run_logs'/f'{RUN}.csv',lf,[lr])
          tf,tail=rc(ROOT/'run_log_tail_198_onward.csv');tail=[r for r in tail if r.get('Run ID')!=RUN];tail.append({k:lr.get(k,'') for k in tf});wc(ROOT/'run_log_tail_198_onward.csv',tf,tail)
          Path(report).write_text(f'# Growth Radar — {RUN} — canonical repair\n\n- Тип RUN: REPAIR, discovery не выполнялся.\n- Исторически заявленный логический пул: 255 карточек.\n- Восстановлено исторических карточек: 255.\n- После обязательной дедупликации по INN/OGRN/legal entity/brand+domain: **{COUNT} уникальных компаний**.\n- Удалено из канонического счётчика как повторные карточки: **{255-COUNT}**.\n- Физический leads_master/contactable_master: {COUNT}/{COUNT}.\n- Contacts: {len(contacts)}; evidence: {len(evidence)}.\n- Orphan: 0/0. Integrity: PASS. Outreach: 0.\n',encoding='utf-8')
          cfgp=Path('CURRENT_WORKING_CONFIG.md');cfg=cfgp.read_text(encoding='utf-8');marker=f'## Canonical dedup repair — {RUN}'
          if marker not in cfg:cfg+=f'\n\n{marker}\n\n- Исторические 255 карточек полностью восстановлены из подтверждённых campaign sources.\n- После строгой дедупликации по Lead/legal identifiers фактический уникальный canonical/contactable pool: **{COUNT}**.\n- Повторных карточек удалено из счётчика: **{255-COUNT}**.\n- Физические `leads_master.csv` / `contactable_master.csv`: **{COUNT}/{COUNT}**.\n- Contacts/evidence перенесены на свежие representative Lead ID; orphan `0/0`.\n- Integrity `PASS`; outreach `0`.\n';cfgp.write_text(cfg,encoding='utf-8')
          print(json.dumps({k:v for k,v in audit.items() if k!='duplicate_map'},ensure_ascii=False))
          PY
      - name: Commit corrected canonical state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/campaigns/new_5000 data/runtime CURRENT_WORKING_CONFIG.md reports/run_2026-08-16_242_physical_master_repair.md
          git commit -m 'repair: deduplicate reconstructed new_5000 canonical pool'
          git push
