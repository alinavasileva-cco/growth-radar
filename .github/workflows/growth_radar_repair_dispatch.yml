name: Growth Radar repair dispatch
on:
  issues:
    types: [opened]
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    if: startsWith(github.event.issue.title, '[growth-radar-trigger]')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical pending integrator
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run growth_radar_integrate_pending.yml --repo "${{ github.repository }}" --ref main
