name: Growth Radar RUN 434 one-shot recovery
on:
  workflow_run:
    workflows:
      - "Growth Radar integrate pending run"
    types:
      - completed
permissions:
  actions: write
  contents: read
jobs:
  dispatch-current-integrator:
    if: ${{ github.event.workflow_run.id == 32988108834 }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch current canonical integrator on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/growth_radar_integrate_pending.yml/dispatches \
            -d '{"ref":"main"}'
