          row={k:'' for k in mf}
          row.update({'Lead ID':LEAD,'Brand':'UNIONDELTA / ПРОФ-ТОН ГРУПП','Legal Name':'ООО «ПРОФ-ТОН ГРУПП»','INN':'7453330306','OGRN / OGRNIP':'1197456034302','Legal Status':'Действует','Region':'Москва','City':'Москва','Segment':'Оптовая торговля','Subsegment':'Автомобильные защитные и стайлинговые плёнки','Website':'https://www.uniondelta.ru/','Company Description':'Поставщик материалов для защиты и стайлинга автомобилей; развивает дилерскую сеть в России, СНГ, Ближнем Востоке и Азии.','Company Size':'Малое предприятие','Employee Estimate':'9','Revenue':'114076000','Profit':'-12173000','Financial Period':'2025','Revenue Source':'РБК Компании','Revenue Confidence':'HIGH','Signal Level':'S1','Signal Summary':'Компания ищет коммерческого директора для масштабирования B2B и дилерской сети; одновременно выручка снизилась с 314,1 млн до 114,1 млн руб. и получен убыток 12,2 млн руб.','Signal Date':'2026-07-27','Signal Source':'https://nesiditsa.ru/vacancy/134701133; https://companies.rbc.ru/id/1197456034302-obschestvo-s-ogranichennoj-otvetstvennostyu-prof-ton-grupp/','News Context':'Вакансия коммерческого директора опубликована 27.07.2026; заявлена стадия масштабирования в России, СНГ, на Ближнем Востоке и в Азии.','Business Context':'Сильный прямой запрос на коммерческую систему на фоне резкого снижения выручки и отрицательной прибыли.','Why Company Is Selected':'Есть прямой S1-сигнал, подтверждённое юрлицо, собственник-гендиректор и несколько официальных маршрутов связи.','Consulting Hypothesis':'Провести диагностику экономики дилерской сети, коммерческой воронки и P&L по рынкам; сформировать 90-дневный план восстановления выручки и маржинальности.','Potential Product':'Коммерческий аудит и дорожная карта масштабирования','Owner':'Панихин Василий Евгеньевич','Founder':'Панихин Василий Евгеньевич','CEO':'Панихин Василий Евгеньевич','LPR':'Панихин Василий Евгеньевич','LPR Role':'Собственник 100% и генеральный директор','LPR Source':'РБК Компании и официальные реквизиты','Primary Phone':'+7 (495) 540-48-05','Primary Email':'info@prof-ton.com','Contact Form':'https://www.uniondelta.ru/company/rekvizity/','Other Contact':'sales@uniondelta.ru; +7 (495) 150-27-10','Contact Type':'Корпоративный маршрут к собственнику-гендиректору','Contact Source':'Официальные сайты UNIONDELTA и PROF-TON','Number Of Contacts Found':'4','Current Stage':'CONTACT ROUTE FOUND','Final Quick Status':'МОЖНО СВЯЗЫВАТЬСЯ','Attempts':'1','Last Action':'Подтверждены юрлицо, ИНН, собственник, финансы, S1-сигнал и официальные контакты','Last Meaningful Change':now,'Next Action':'Во второй итерации подготовить персонализированный коммерческий аудит; не отправлять без отдельного разрешения','Added At':now,'Updated At':now,'Run ID':RUN})
          m.append(row); write('data/leads_master.csv',mf,m)
          cf,c=read('data/contacts.csv')
          contacts=[('C-102-01','+7 (495) 540-48-05','phone','официальный корпоративный телефон','https://prof-ton.ru/company/requisites/'),('C-102-02','info@prof-ton.com','email','официальный корпоративный email','https://prof-ton.ru/company/requisites/'),('C-102-03','sales@uniondelta.ru','email','официальный email отдела продаж','https://www.uniondelta.ru/company/rekvizity/'),('C-102-04','+7 (495) 150-27-10','phone','официальный телефон UNIONDELTA','https://www.uniondelta.ru/company/rekvizity/')]
