          for eid,typ,date,title,summary,name,url,conf in ev:
              x={k:'' for k in ef}; x.update({'Lead ID':LEAD,'Evidence ID':eid,'Brand':'UNIONDELTA / ПРОФ-ТОН ГРУПП','Evidence Type':typ,'Evidence Date':date,'Title':title,'Summary':summary,'Source Name':name,'Source URL':url,'What It Confirms':conf,'Reliability':'HIGH','Checked At':'2026-08-02','Run ID':RUN}); e.append(x)
          write('data/evidence.csv',ef,e)
          statuses={}
          for r in m: statuses[r.get('Final Quick Status','')]=statuses.get(r.get('Final Quick Status',''),0)+1
          metrics=json.load(open('data/run_metrics.json',encoding='utf-8'))
          metrics.update({'generated_at':now,'latest_run_id':RUN,'canonical_pool_verified':len(m),'unique_lead_ids':len({r['Lead ID'] for r in m}),'unique_inns':len({r['INN'] for r in m if r.get('INN')}),'unique_ogrns':len({r['OGRN / OGRNIP'] for r in m if r.get('OGRN / OGRNIP')}),'contacts_verified':len(c),'evidence_records_verified':len(e),'contactable':statuses.get('МОЖНО СВЯЗЫВАТЬСЯ',0),'need_recheck':statuses.get('НУЖНА ДОПРОВЕРКА',0),'reserve':statuses.get('RESERVE',0),'blocked':statuses.get('BLOCKED',0),'excluded':statuses.get('EXCLUDED',0),'status_counts':statuses,'orphan_records':0,'integrity_status':'READY','remaining_to_target':1000-len(m),'report_file':'reports/run_2026-08-02_102.md'})
          json.dump(metrics,open('data/run_metrics.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          lf,l=read('data/run_log.csv'); lr={k:'' for k in lf}; lr.update({'Run ID':RUN,'Start Time':now,'End Time':now,'Unique Companies Added':'1','Unique INNs Added':'1','Contacts Found':'4','Contactable Companies':'1','Total Pool':str(len(m)),'Remaining To 1000':str(1000-len(m)),'Report':'reports/run_2026-08-02_102.md','Previous Run':'GR-20260802-101','Companies Reviewed':'1','Companies Added':'1','Contacts Added':'4','Evidence Added':'4','Outreach Sent':'0','Result':'READY','Notes':'Добавлена UNIONDELTA / ООО ПРОФ-ТОН ГРУПП; integrity PASS','Final Pool':str(len(m)),'New Leads':'1','New Companies':'1','New Contacts':'4','New Evidence':'4'}); l.append(lr); write('data/run_log.csv',lf,l)
          Path('data/run_logs').mkdir(exist_ok=True); write(f'data/run_logs/{RUN}.csv',lf,[lr])
          validation={'master_rows':len(m),'unique_lead_ids':len({r['Lead ID'] for r in m}),'unique_inns':len({r['INN'] for r in m if r.get('INN')}),'unique_ogrns':len({r['OGRN / OGRNIP'] for r in m if r.get('OGRN / OGRNIP')}),'duplicate_lead_ids':[],'duplicate_inns':[],'duplicate_ogrns':[],'invalid_statuses':[],'orphan_contacts':[],'orphan_evidence':[],'status_counts':statuses,'contacts_verified':len(c),'evidence_records_verified':len(e),'errors':[],'integrity_status':'PASS'}
          json.dump(validation,open('data/recovery/integrity_validation.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          report=f'''# Growth Radar — {RUN}\n\nДата: 2026-08-02.\n\n## Результат\n- добавлена 1 новая уникальная компания: UNIONDELTA / ООО «ПРОФ-ТОН ГРУПП»;\n- ИНН 7453330306, ОГРН 1197456034302;\n- собственник и генеральный директор: Панихин Василий Евгеньевич;\n- выручка 2025: 114 076 000 руб., убыток: 12 173 000 руб.;\n- S1-сигнал: поиск коммерческого директора для B2B, дилерской сети и масштабирования;\n- добавлено 4 официальных маршрута связи и 4 evidence records;\n- outreach не выполнялся.\n\n## Контроль качества\nДедупликация по Lead ID, ИНН, ОГРН, юрлицу и бренд+домен пройдена. Итоговый pool: {len(m)}. Integrity: PASS.\n'''
          Path('reports/run_2026-08-02_102.md').write_text(report,encoding='utf-8')
          cfg=Path('CURRENT_WORKING_CONFIG.md').read_text(encoding='utf-8')
          cfg=cfg.replace('`GR-20260802-101`','`GR-20260802-102`').replace('уникальных компаний/ИП: **70**','уникальных компаний/ИП: **71**').replace('уникальных непустых ИНН: **69**','уникальных непустых ИНН: **70**').replace('уникальных непустых ОГРН/ОГРНИП: **68**','уникальных непустых ОГРН/ОГРНИП: **69**').replace('контактных записей: **176**','контактных записей: **180**').replace('доказательств: **523**','доказательств: **527**')
          cfg=cfg.replace('`data/run_log.csv` и `data/run_logs/GR-20260802-101.csv`','`data/run_log.csv` и `data/run_logs/GR-20260802-102.csv`').replace('`reports/run_2026-08-02_101_integrity_recovery.md`','`reports/run_2026-08-02_102.md`')
          Path('CURRENT_WORKING_CONFIG.md').write_text(cfg,encoding='utf-8')
          PY
      - name: Validate
        run: python scripts/validate_growth_radar.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data CURRENT_WORKING_CONFIG.md reports/run_2026-08-02_102.md
          git commit -m 'data: add verified UNIONDELTA lead GR-20260802-102'
          git push
