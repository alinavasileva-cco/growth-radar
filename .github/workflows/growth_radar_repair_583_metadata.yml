name: Growth Radar repair RUN 583 metadata
on:
  push:
    paths:
      - '.github/workflows/growth_radar_repair_583_metadata.yml'
permissions:
  contents: write
concurrency:
  group: growth-radar-repair-583-metadata
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair current RUN metadata only
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          root = Path('.')
          run_id = 'N5K-20260902-583'
          now = '2026-09-02T08:28:29+03:00'

          runtime_path = root / 'data/runtime/current_run_status.json'
          runtime = json.loads(runtime_path.read_text(encoding='utf-8'))
          assert runtime['run_id'] == run_id
          assert runtime['new_cycle']['current_canonical_count'] == 596
          assert runtime['new_cycle']['current_contactable_count'] == 596
          assert runtime['integrity_status'] == 'PASS'
          assert runtime['orphan_contacts'] == 0 and runtime['orphan_evidence'] == 0
          assert runtime['active_wip'] == 0 and runtime['outreach_sent'] == 0
          runtime['status'] = 'COMPLETED_WITH_THROUGHPUT_DISCLOSURE'
          runtime['throughput_disclosure'] = {
              'raw_distinct_employer_level': 250,
              'minimum_user_floor_120_met': True,
              'user_supplemental_250_threshold_met': True,
              'current_config_preferred_400_800_met': False,
              'current_config_continue_threshold_300_met': False,
              'normal_throughput_completion': False,
              'note': 'After reaching 250 verified distinct employer-level raw, an additional source-switch wave was attempted. Additional observations were not added to authoritative raw because exact distinct employer-level counting was not reproducible within this run. No padding; criteria unchanged.'
          }
          runtime_path.write_text(json.dumps(runtime, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          target_path = root / 'data/runtime/campaign_target.json'
          target = json.loads(target_path.read_text(encoding='utf-8'))
          assert target['current_canonical_count'] == 596 and target['current_contactable_count'] == 596
          target.update({
              'latest_attempted_run': run_id,
              'latest_attempted_run_status': 'COMPLETED_WITH_THROUGHPUT_DISCLOSURE',
              'canonical_integration_run_id': run_id,
              'hourly_baseline_count': 596,
              'hourly_net_new': 0,
              'fresh_staging': 'RUN 583 consumed fresh growth_news staging first. Two PREQUALIFIED candidates were independently rechecked; neither reached QUALIFIED. Qualified staged not counted is zero.',
              'repair_required': 'THROUGHPUT_DISCLOSURE_RAW_250_BELOW_CURRENT_CONFIG_CONTINUE_THRESHOLD_300',
              'note': 'N5K-20260902-583 physically integrated with +0 net new; canonical/contactable 596/596; integrity PASS; orphan 0/0; staged qualified 0; active WIP 0; outreach 0. Authoritative raw=250; normal throughput completion=false because CURRENT_WORKING_CONFIG prefers 400-800 and says continue when raw<300.'
          })
          target['latest_run_efficiency'] = {
              'run_id': run_id,
              'raw': 250,
              'raw_scope_note': '250 distinct employer-level raw counted after name-level cross-lane dedup; no search-result-row padding. Extra post-250 observations were not counted without reproducible exact distinct-employer instrumentation.',
              'fast_gate': 2,
              'size': 2,
              'legal': 0,
              'signal': 0,
              'lpr': 0,
              'contact': 0,
              'qualified': 0,
              'duplicates': 0,
              'excluded_early_reject': 250,
              'qualified_raw_pct': 0.0,
              'fast_gate_raw_pct': 0.8,
              'raw_target_met': False,
              'minimum_raw_floor_met': True,
              'user_supplemental_250_threshold_met': True,
              'preferred_config_raw_target_met': False,
              'supplemental_discovery_performed': True,
              'normal_throughput_completion': False,
              'raw_count_note': 'Fresh staging raw=5, low-overlap industry-news raw=225, regional production/investment/expansion raw=20. Total authoritative distinct employer-level raw=250.'
          }
          target['latest_run_lane_efficiency'] = [
              {'lane':'fresh_worker_growth_news_20260902_082541','raw':5,'net_qualified':0,'next_state':'ROTATE_AFTER_FAIL_CLOSED_RECHECK'},
              {'lane':'low_overlap_industry_news_aug_2026','raw':225,'net_qualified':0,'next_state':'ROTATE'},
              {'lane':'regional_production_investment_expansion','raw':20,'net_qualified':0,'next_state':'CONTINUE_WITH_EXACT_RAW_INSTRUMENTATION'}
          ]
          target_path.write_text(json.dumps(target, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          cfg_path = root / 'CURRENT_WORKING_CONFIG.md'
          text = cfg_path.read_text(encoding='utf-8')
          reps = [
              (r'(?m)^\*\*Версия:\*\* .*$', f'**Версия:** {now}  '),
              (r'(?m)^\*\*Последний полностью завершённый RUN:\*\* .*$', f'**Последний полностью завершённый RUN:** `{run_id}`  '),
              (r'(?m)^- последний завершённый RUN: .*$', f'- последний завершённый RUN: `{run_id}`;'),
          ]
          for pat, repl in reps:
              text, n = re.subn(pat, repl, text, count=1)
              assert n == 1, (pat, n)
          cfg_path.write_text(text, encoding='utf-8')

          report_path = root / 'reports/run_20260902_583.md'
          report = '''# Growth Radar RUN N5K-20260902-583

- Status: COMPLETED_WITH_THROUGHPUT_DISCLOSURE
- Added: 0
- Baseline: 596
- Canonical/contactable: 596/596
- Authoritative distinct employer-level raw: 250
- Fast gate: 2
- SIZE: 2
- LEGAL: 0
- SIGNAL: 0
- LPR: 0
- CONTACT: 0
- Qualified: 0
- Duplicates: 0
- Excluded: 250
- Integrity: PASS
- Orphan contacts/evidence: 0/0
- Staged qualified not counted: 0
- Active WIP: 0
- Outreach: 0
- Normal throughput completion: false

## Why qualified=0

Fresh worker staging was consumed first. `Петровакс Фарм` was rejected fail-closed at LEGAL: staging supplied OGRN `1027700078400` for INN `7702302492`, while the current independently checked legal card for the same INN showed OGRN `1037700012745`; the legal identity conflict was not guessed through. `Турбокомплект` was not promoted to QUALIFIED because fresh independent verification in this run did not reliably reproduce the required official SIGNAL/CONTACT evidence. No candidate from supplemental discovery was promoted without the full LEGAL -> SIGNAL -> LPR -> CONTACT chain.

## Supplemental discovery

After the staging recheck, discovery switched across low-overlap industrial/business-change and regional production/investment/expansion sources. Authoritative raw was capped at 250 distinct employer-level companies after cross-lane name dedup; search-result rows, obvious non-companies, foreign-only items and duplicate observations were not counted. Sources included dated August 2026 company-news archives at `elec.ru/news/2026/08/29/`, `/08/28/`, `/08/27/`, `/08/26/`, `/08/24/`, `/08/21/`, `/08/20/`, `/08/13/`, `/08/12/`, `/08/10/`, `/08/07/`, `/08/06/`, `/08/05/`, `/08/04/`, `/08/03/`, plus `press-release.ru/branches/equipment/` and `press-release.ru/branches/chemistry/` and regional production/investment/expansion searches.

The direct 250+ supplemental threshold was reached, but the current `CURRENT_WORKING_CONFIG.md` prefers 400-800 raw and says a run below 300 should continue source switching while reasonably possible. A further source-switch wave was attempted after 250, but its extra observations were not added to authoritative raw because an exact distinct-employer count was not reproducible in this run. Therefore this run is not represented as a normal throughput completion. Criteria were not changed or weakened.
'''
          report_path.write_text(report, encoding='utf-8')

          consumed_dir = root / 'data/runtime/worker_consumed_indexes'
          consumed_dir.mkdir(parents=True, exist_ok=True)
          consumed = {
              'run_id': run_id,
              'consumed_at': now,
              'files': ['data/pending_workers/growth_news/20260902-082541-growth-news.json'],
              'raw_candidates': 5,
              'prequalified_rechecked': 2,
              'net_qualified': 0,
              'qualified_staged_not_counted': 0,
              'immutable_source_retained': True,
              'note': 'Fresh staging consumed before canonical supplemental discovery; source file retained.'
          }
          (consumed_dir / f'{run_id}.json').write_text(json.dumps(consumed, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          pending_path = root / 'data/runtime/growth_radar_pending_run.json'
          pending = json.loads(pending_path.read_text(encoding='utf-8'))
          assert pending['run_id'] == run_id
          pending['status'] = 'CLEARED_AFTER_INTEGRATION'
          pending['qualified_companies'] = []
          pending['qualified_staged_not_counted'] = 0
          pending['note'] = 'N5K-20260902-583 integrated physically; canonical/contactable 596/596; integrity PASS; orphan 0/0; staged qualified 0; active WIP 0; outreach 0; throughput disclosure raw=250.'
          pending_path.write_text(json.dumps(pending, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit repaired metadata
        run: |
          git config user.name "growth-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add CURRENT_WORKING_CONFIG.md data/runtime/current_run_status.json data/runtime/campaign_target.json data/runtime/growth_radar_pending_run.json data/runtime/worker_consumed_indexes/N5K-20260902-583.json reports/run_20260902_583.md
          git diff --cached --quiet && exit 0
          git commit -m "Growth Radar: finalize RUN 583 metadata disclosure"
          git pull --rebase origin main
          git push
