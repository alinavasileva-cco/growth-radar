name: Outreach App CI

on:
  push:
    branches:
      - feature/outreach-app
    paths:
      - "outreach-app/**"
      - ".github/workflows/outreach-app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: outreach-app
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/outreach
      APP_URL: http://localhost:3000
      SESSION_SECRET: ci-session-secret-at-least-32-characters-long
      TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GOOGLE_CLIENT_ID: ci-client-id
      GOOGLE_CLIENT_SECRET: ci-client-secret
      ALLOWED_EMAIL: ci@example.com
      CRON_SECRET: ci-cron-secret
      GROWTH_RADAR_CSV_URL: https://raw.githubusercontent.com/alinavasileva-cco/growth-radar/main/data/campaigns/new_5000/contactable_master.csv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: outreach-app/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run safety tests
        run: npm test
      - name: Type check
        run: npm run check
      - name: Production build
        run: npm run build
