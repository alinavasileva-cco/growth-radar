name: Growth Radar GR-20260802-102 trigger
on:
  push:
    paths:
      - 'data/triggers/run_102.txt'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute canonical run script embedded in primary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/growth_radar_run_102.yml').read_text(encoding='utf-8')
          block=p.split("python - <<'PY'",1)[1].split("\n          PY",1)[0]
          lines=block.splitlines()[1:]
          code='\n'.join((line[10:] if line.startswith('          ') else line) for line in lines)
          exec(compile(code,'GR-20260802-102','exec'))
          PY
      - name: Validate
        run: python scripts/validate_growth_radar.py
      - name: Commit verified data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data CURRENT_WORKING_CONFIG.md reports/run_2026-08-02_102.md
          git commit -m 'data: add verified UNIONDELTA lead GR-20260802-102'
          git push
